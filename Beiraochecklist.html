        }

        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .section-header {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            color: white;
            padding: 20px 25px;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-progress {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .section-content {
            padding: 25px;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }

        .checklist-item:hover {
            background: #f8f9fa;
            transform: translateX(5px);
        }

        .checklist-item.completed {
            background: #d4edda;
            border-color: #27ae60;
        }

        .checklist-item input[type="checkbox"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            accent-color: #27ae60;
            cursor: pointer;
        }

        .item-content {
            flex: 1;
        }

        .item-id {
            font-weight: bold;
            color: #3498db;
            margin-right: 10px;
        }

        .item-text {
            color: #2c3e50;
        }

        .item-details {
            margin-top: 8px;
            padding-left: 10px;
            border-left: 3px solid #3498db;
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .item-details ul {
            margin: 5px 0;
            padding-left: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .stats {
                gap: 20px;
            }

            .controls {
                padding: 15px 20px;
            }

            .content {
                padding: 20px;
            }

            .section-content {
                padding: 20px;
            }

            .checklist-item {
                padding: 12px;
            }
        }
    </style>
</head>

        let totalItems = 0;
        let completedItems = 0;

        function generateContent() {
            const content = document.getElementById("content");
            content.innerHTML = "";

            for (const [sectionName, items] of Object.entries(checklistData)) {
                totalItems += items.length;

                const section = document.createElement("div");
                section.className = "section";

                const sectionHeader = document.createElement("div");
                sectionHeader.className = "section-header";
                sectionHeader.innerHTML = `
                    <span>${sectionName}</span>
                    <span class="section-progress" id="progress-${sectionName.replace(
                    /\s+/g,
                    "-"
                )}">0/${items.length}</span>
                `;

                const sectionContent = document.createElement("div");
                sectionContent.className = "section-content";

                items.forEach((item) => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "checklist-item";

                    itemDiv.innerHTML = `
                        <input type="checkbox" id="${item.id
                        }" onchange="updateProgress()">
                        <div class="item-content">
                            <div>
                                <span class="item-id">[${item.id}]</span>
                                <span class="item-text">${item.text}</span>
                            </div>
                            ${item.details
                            ? `<div class="item-details">${item.details
                                .replace(/\n/g, "<br>")
                                .replace(/•/g, "&bull;")}</div>`
                            : ""
                        }
                        </div>
                    `;

                    sectionContent.appendChild(itemDiv);
                });

                section.appendChild(sectionHeader);
                section.appendChild(sectionContent);
                content.appendChild(section);
            }

            updateProgress();
        }

        function updateProgress() {
            completedItems = 0;
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');

            checkboxes.forEach((checkbox) => {
                const item = checkbox.closest(".checklist-item");
                if (checkbox.checked) {
                    completedItems++;
                    item.classList.add("completed");
                } else {
                    item.classList.remove("completed");
                }
            });

            // Update section progress
            for (const [sectionName, items] of Object.entries(checklistData)) {
                const sectionId = sectionName.replace(/\s+/g, "-");
                const progressElement = document.getElementById(
                    `progress-${sectionId}`
                );

                let sectionCompleted = 0;
                items.forEach((item) => {
                    const checkbox = document.getElementById(item.id);
                    if (checkbox && checkbox.checked) {
                        sectionCompleted++;
                    }
                });

                if (progressElement) {
                    progressElement.textContent = `${sectionCompleted}/${items.length}`;
                }
            }

            // Update main stats
            document.getElementById("totalItems").textContent = totalItems;
            document.getElementById("completedItems").textContent = completedItems;

            const progressPercent =
                totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;
            document.getElementById(
                "progressPercent"
            ).textContent = `${progressPercent}%`;

            // Update progress bar
            document.getElementById(
                "progressFill"
            ).style.width = `${progressPercent}%`;
        }

        function checkAll() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach((checkbox) => {
                checkbox.checked = true;
            });
            updateProgress();
        }

        function uncheckAll() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach((checkbox) => {
                checkbox.checked = false;
            });
            updateProgress();
        }

        function exportResults() {
            const results = {
                timestamp: new Date().toISOString(),
                totalItems: totalItems,
                completedItems: completedItems,
                progressPercent: Math.round((completedItems / totalItems) * 100),
                items: {},
            };

            for (const [sectionName, items] of Object.entries(checklistData)) {
                results.items[sectionName] = items.map((item) => ({
                    id: item.id,
                    text: item.text,
                    checked: document.getElementById(item.id)?.checked || false,
                }));
            }

            const blob = new Blob([JSON.stringify(results, null, 2)], {
                type: "application/json",
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `security-checklist-results-${new Date().toISOString().split("T")[0]
                }.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize the page
        document.addEventListener("DOMContentLoaded", function () {
            generateContent();
        });
    </script>
